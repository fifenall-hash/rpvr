<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>룩폰v룩 마스터 모바일</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; padding: 10px; background-color: #f0f0f0; display: flex; flex-direction: column; align-items: center; }
        h2 { margin: 10px 0; font-size: 20px; text-align: center; }
        #status { font-weight: bold; margin-bottom: 5px; color: #333; font-size: 18px; }
        #move-counter { font-size: 14px; margin-bottom: 5px; color: #555; font-weight: bold; transition: color 0.3s; }
        #feedback { font-size: 14px; margin-bottom: 15px; color: blue; text-align: center; min-height: 20px; font-weight: bold; }
        
        #board-container { position: relative; width: 100%; max-width: 500px; aspect-ratio: 1 / 1; border: 2px solid #333; }
        #board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; }
        
        .square { display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
        .light { background-color: #EEEED2; }
        .dark { background-color: #769656; }
        .highlight { background-color: #F6F669 !important; }
        
        .dot { width: 30%; height: 30%; background-color: rgba(0, 0, 0, 0.25); border-radius: 50%; pointer-events: none; }
        .piece { width: 90%; height: 90%; background-size: cover; background-position: center; pointer-events: none; }
        
        #svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #controls, #replay-controls { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 500px;}
        
        .mode-select { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-bottom: 5px; flex-wrap: wrap; justify-content: center; }
        .mode-label { font-weight: bold; color: #333; }
        
        .btn-group-row { display: flex; gap: 10px; width: 100%; justify-content: center; }
        .nav-group { display: flex; gap: 5px; width: 100%; flex-wrap: nowrap; justify-content: space-between; }
        
        button { padding: 10px 5px; font-size: 13px; font-weight: bold; color: white; border: none; border-radius: 8px; flex: 1; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: opacity 0.2s; }
        button:active:not(:disabled) { transform: translateY(2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
        
        .btn-new { background-color: #4CAF50; }
        .btn-new-center { background-color: #2980b9; }
        .btn-restart { background-color: #f39c12; }
        .btn-editor { background-color: #16a085; }
        .btn-undo { background-color: #7f8c8d; }
        .btn-demo { background-color: #8e44ad; }
        
        .btn-nav { background-color: #34495e; font-size: 18px; padding: 10px; min-width: 0; }
        .btn-exit { background-color: #e74c3c; margin-top: 5px; width: 100%; }
    </style>
</head>
<body>

    <h2>룩폰v룩 마스터</h2>
    <div id="status">로딩 중...</div>
    <div id="move-counter">현재 1수 진행 중 (무승부까지: 50수 남음)</div>
    <div id="feedback">체스 엔진을 준비하고 있습니다.</div>

    <div id="board-container">
        <div id="board"></div>
        <svg id="svg-layer" viewBox="0 0 8 8">
            <defs>
                <marker id="arrowhead" markerWidth="3" markerHeight="3" refX="1.5" refY="1.5" orient="auto">
                    <polygon points="0 0, 3 1.5, 0 3" fill="#e74c3c" />
                </marker>
            </defs>
            <line id="tutor-arrow" x1="0" y1="0" x2="0" y2="0" stroke="#e74c3c" stroke-width="0.15" marker-end="url(#arrowhead)" display="none" />
        </svg>
    </div>

    <div id="controls">
        <div class="mode-select">
            <span class="mode-label">흑 차례:</span>
            <label><input type="radio" name="mode" value="random" onchange="handleModeChange()"> 랜덤</label>
            <label><input type="radio" name="mode" value="engine" checked onchange="handleModeChange()"> 엔진</label>
            <label><input type="radio" name="mode" value="logic" onchange="handleModeChange()"> 로직</label>
            <label><input type="radio" name="mode" value="user" onchange="handleModeChange()"> 유저</label>
        </div>
        
        <div class="btn-group-row">
            <button class="btn-new" onclick="newGame('random')">랜덤시작</button>
            <button class="btn-new-center" onclick="newGame('lucena')">루세나시작</button>
            <button class="btn-restart" onclick="restartGame()">재시작</button>
        </div>
        <div class="btn-group-row">
            <button class="btn-editor" onclick="startEditor()">편집기</button>
            <button class="btn-undo" onclick="undoMove()">되돌리기</button>
            <button class="btn-demo" onclick="runAIDemo()">엔진시범</button>
        </div>
    </div>

    <div id="replay-controls" style="display: none;">
        <div class="nav-group">
            <button class="btn-nav" onclick="navDemo('first')">≪</button>
            <button class="btn-nav" onclick="navDemo('prev')">＜</button>
            <button class="btn-nav" onclick="navDemo('next')">＞</button>
            <button class="btn-nav" onclick="navDemo('last')">≫</button>
        </div>
        <button class="btn-exit" onclick="exitDemo()">시범 종료 및 돌아가기</button>
    </div>

    <script>
        const game = new Chess();
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        let selectedSquare = null;
        let isCalculating = false;
        let isDemoMode = false;
        let missedBestMove = null;

        let isEditorMode = false;
        let editorStep = 0; 
        let editorPos = { wk: null, wr: null, wp: null, bk: null, br: null };

        let initialFenOfCurrentGame = "";
        let savedFenBeforeDemo = "";
        let savedMovesBeforeDemo = []; 
        let demoHistory = [];
        let currentDemoIndex = 0;

        const pieceUrls = {
            'K': 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wk.png',
            'R': 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wr.png',
            'P': 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wp.png',
            'k': 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bk.png',
            'r': 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/br.png'
        };

        const moveSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-self.mp3');
        const captureSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/capture.mp3');

        function playSound(moveObj) {
            if (!moveObj) return;
            if (moveObj.captured) {
                captureSound.currentTime = 0;
                captureSound.play().catch(e => {});
            } else {
                moveSound.currentTime = 0;
                moveSound.play().catch(e => {});
            }
        }

        const workerCode = `importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.0/stockfish.js');`;
        const blob = new Blob([workerCode], {type: 'application/javascript'});
        const engine = new Worker(URL.createObjectURL(blob));

        engine.onmessage = function(event) {
            if (event.data === "uciok") newGame('lucena');
        };
        engine.postMessage("uci");

        function getBestMove(fen, timeLimit = 1500) {
            return new Promise(resolve => {
                const listener = function(event) {
                    const msg = event.data;
                    if (msg.startsWith("bestmove")) {
                        engine.removeEventListener('message', listener);
                        resolve(msg.split(" ")[1]); 
                    }
                };
                engine.addEventListener('message', listener);
                engine.postMessage(`position fen ${fen}`);
                engine.postMessage(`go movetime ${timeLimit}`);
            });
        }

        function assembleFen(wk, wr, wp, bk, br) {
            let board = Array.from({ length: 8 }, () => Array(8).fill(null));
            board[wk.r][wk.c] = 'K';
            board[wr.r][wr.c] = 'R';
            board[wp.r][wp.c] = 'P';
            board[bk.r][bk.c] = 'k';
            board[br.r][br.c] = 'r';

            let fen = "";
            for (let r = 0; r < 8; r++) {
                let emptyCount = 0;
                for (let c = 0; c < 8; c++) {
                    if (board[r][c] === null) emptyCount++;
                    else {
                        if (emptyCount > 0) fen += emptyCount;
                        fen += board[r][c];
                        emptyCount = 0;
                    }
                }
                if (emptyCount > 0) fen += emptyCount;
                if (r < 7) fen += "/";
            }
            return fen + " w - - 0 1";
        }

        function generateRandomValidFEN_Anywhere() {
            while (true) {
                let squares = [];
                while (squares.length < 5) {
                    let randomSq = Math.floor(Math.random() * 64);
                    if (!squares.includes(randomSq)) squares.push(randomSq);
                }
                const wpIdx = squares[2];
                const wpRank = Math.floor(wpIdx / 8);
                
                // 폰은 1랭크나 8랭크에 있을 수 없습니다.
                if (wpRank === 0 || wpRank === 7) continue;

                const wk = { r: Math.floor(squares[0] / 8), c: squares[0] % 8 };
                const wr = { r: Math.floor(squares[1] / 8), c: squares[1] % 8 };
                const wp = { r: wpRank, c: wpIdx % 8 };
                const bk = { r: Math.floor(squares[3] / 8), c: squares[3] % 8 };
                const br = { r: Math.floor(squares[4] / 8), c: squares[4] % 8 };

                // 킹끼리는 인접할 수 없습니다.
                if (Math.abs(wk.r - bk.r) <= 1 && Math.abs(wk.c - bk.c) <= 1) continue;

                let fen = assembleFen(wk, wr, wp, bk, br);
                const tempGame = new Chess();
                
                // chess.js를 이용해 유효한 체스 상태인지 검증합니다.
                if (tempGame.load(fen)) {
                    // 시작하자마자 흑이 체크메이트이거나 백 킹이 체크 상태면 안 됩니다 (백 차례 기준).
                    if (!tempGame.in_check() && !tempGame.game_over()) {
                        return fen;
                    }
                }
            }
        }

        function generateLucenaFEN() {
            // 루세나 포지션의 기본 FEN (백 폰이 승급 직전인 상태)
            return "1K6/1P1k4/8/8/8/8/2R5/7r w - - 0 1";
        }

        function renderBoard() {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = ''; 
            const boardState = game.board(); 
            const legalMoves = game.moves({ verbose: true });

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareId = files[c] + (8 - r);
                    const squareDiv = document.createElement('div');
                    squareDiv.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    squareDiv.dataset.square = squareId;
                    squareDiv.onclick = () => handleSquareClick(squareId);

                    if (selectedSquare === squareId) squareDiv.classList.add('highlight');

                    const piece = boardState[r][c];
                    if (piece) {
                        const pieceSymbol = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                        if (pieceUrls[pieceSymbol]) {
                            const img = document.createElement('div');
                            img.className = 'piece';
                            img.style.backgroundImage = `url(${pieceUrls[pieceSymbol]})`;
                            squareDiv.appendChild(img);
                        }
                    }

                    if (selectedSquare && legalMoves.some(m => m.from === selectedSquare && m.to === squareId) && !isDemoMode && document.getElementById('replay-controls').style.display === 'none') {
                        const dot = document.createElement('div');
                        dot.className = 'dot';
                        squareDiv.appendChild(dot);
                    }
                    boardDiv.appendChild(squareDiv);
                }
            }
            drawArrow();
        }

        function drawArrow() {
            const arrow = document.getElementById('tutor-arrow');
            if (missedBestMove && !isDemoMode && document.getElementById('replay-controls').style.display === 'none') {
                const fromFile = files.indexOf(missedBestMove.charAt(0));
                const fromRank = 8 - parseInt(missedBestMove.charAt(1));
                const toFile = files.indexOf(missedBestMove.charAt(2));
                const toRank = 8 - parseInt(missedBestMove.charAt(3));

                arrow.setAttribute('x1', fromFile + 0.5);
                arrow.setAttribute('y1', fromRank + 0.5);
                arrow.setAttribute('x2', toFile + 0.5);
                arrow.setAttribute('y2', toRank + 0.5);
                arrow.style.display = 'block';
            } else {
                arrow.style.display = 'none';
            }
        }

        function updateStatus() {
            const statusEl = document.getElementById('status');
            const feedbackEl = document.getElementById('feedback');
            const counterEl = document.getElementById('move-counter');

            if (isEditorMode) {
                statusEl.innerText = "편집 모드 진행 중";
                const piecesName = ["백 킹(K)", "백 룩(R)", "백 폰(P)", "흑 킹(k)", "흑 룩(r)"];
                feedbackEl.innerText = `빈 칸을 터치하여 ${piecesName[editorStep]}을 배치하세요.`;
                feedbackEl.style.color = "#d35400"; 
                counterEl.innerText = "자유롭게 초기 보드를 구성할 수 있습니다.";
                return; 
            }

            const fenParts = game.fen().split(' ');
            const halfMoves = parseInt(fenParts[4], 10);
            const fullMoves = parseInt(fenParts[5], 10); 
            const movesLeft = 50 - Math.floor(halfMoves / 2);

            if (movesLeft <= 10) counterEl.style.color = "#e74c3c";
            else counterEl.style.color = "#555";
            
            counterEl.innerText = `현재 ${fullMoves}수 진행 중 (무승부까지: ${movesLeft}수 남음)`;

            if (game.in_checkmate()) {
                statusEl.innerText = "🎉 승리! 체크메이트 🎉";
                feedbackEl.innerText = isDemoMode ? "AI가 체크메이트를 달성했습니다!" : "완벽한 마무리입니다!";
                feedbackEl.style.color = "green";
                counterEl.innerText = `총 ${fullMoves}수 만에 승리 성공!`;
                counterEl.style.color = "#2980b9";
            } else if (game.in_draw() || halfMoves >= 100) {
                let drawReason = "무승부!";
                let drawDetails = "무승부로 게임이 종료되었습니다.";

                if (game.in_stalemate()) {
                    drawReason = "무승부! (스테일메이트)";
                    drawDetails = "킹이 공격받고 있지 않지만, 합법적인 수가 없습니다.";
                } else if (game.insufficient_material()) {
                    drawReason = "무승부! (기물 부족)";
                    drawDetails = "체크메이트를 강제할 수 있는 기물이 부족합니다.";
                } else if (game.in_threefold_repetition()) {
                    drawReason = "무승부! (동형 반복)";
                    drawDetails = "동일한 보드 상태가 3번 반복되었습니다.";
                } else if (halfMoves >= 100) {
                    drawReason = "무승부! (50수 규칙)";
                    drawDetails = "50수 동안 폰의 이동이나 기물 포획이 없었습니다.";
                }

                statusEl.innerText = drawReason;
                counterEl.innerText = drawDetails;
                counterEl.style.color = "#e74c3c";
            } else if (!isCalculating && !isDemoMode) {
                statusEl.innerText = game.turn() === 'w' ? "현재 턴: 백" : "현재 턴: 흑";
            } else if (isDemoMode && document.getElementById('replay-controls').style.display === 'block') {
                statusEl.innerText = "AI 기보 복기 중";
            }
        }

        function stopDemoAndReset() {
            isDemoMode = false;
            isEditorMode = false;
            document.getElementById('replay-controls').style.display = 'none';
            document.getElementById('controls').style.display = 'flex';
            document.querySelectorAll('button').forEach(btn => btn.disabled = false);
        }

        function startEditor() {
            stopDemoAndReset();
            isEditorMode = true;
            editorStep = 0;
            editorPos = { wk: null, wr: null, wp: null, bk: null, br: null };
            
            game.clear(); 
            missedBestMove = null;
            selectedSquare = null;
            
            renderBoard();
            updateStatus();
        }

        function newGame(type) {
            stopDemoAndReset();

            const fen = type === 'lucena' ? generateLucenaFEN() : generateRandomValidFEN_Anywhere();
            game.load(fen);
            
            initialFenOfCurrentGame = fen;
            selectedSquare = null;
            missedBestMove = null;
            isCalculating = false;
            
            const message = type === 'lucena' ? "루세나 포지션 배치 완료! 승급을 향해 폰을 전진시키세요." : "무작위 배치 완료! 첫 수를 둬보세요.";
            document.getElementById('feedback').innerText = message;
            document.getElementById('feedback').style.color = "blue";
            
            renderBoard();
            updateStatus();
        }

        function restartGame() {
            if (!initialFenOfCurrentGame) return; 
            
            stopDemoAndReset();
            game.load(initialFenOfCurrentGame);
            
            selectedSquare = null;
            missedBestMove = null;
            isCalculating = false;
            
            document.getElementById('feedback').innerText = "처음 상태로 되돌렸습니다. 다시 도전해 보세요!";
            document.getElementById('feedback').style.color = "blue";
            
            renderBoard();
            updateStatus();
        }

        function undoMove() {
            if (isCalculating || isDemoMode || isEditorMode || document.getElementById('replay-controls').style.display === 'block') return;
            if (game.history().length === 0) return;

            const mode = document.querySelector('input[name="mode"]:checked').value;
            let moveUndone = null;

            if (mode === 'user') {
                moveUndone = game.undo();
            } else {
                game.undo(); 
                moveUndone = game.undo() || true; 
            }

            if (moveUndone) {
                missedBestMove = null;
                selectedSquare = null;
                moveSound.currentTime = 0;
                moveSound.play().catch(e => {});

                renderBoard();
                updateStatus();
                
                document.getElementById('feedback').innerText = "수를 되돌렸습니다.";
                document.getElementById('feedback').style.color = "blue";
            }
        }

        function handleModeChange() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            if (game.turn() === 'b' && mode !== 'user' && !isCalculating && !isDemoMode && !isEditorMode && !game.game_over() && document.getElementById('replay-controls').style.display === 'none') {
                makeComputerMove();
            }
        }

        async function handleSquareClick(square) {
            if (!isEditorMode && game.game_over()) return;
            if (isCalculating || isDemoMode || document.getElementById('replay-controls').style.display === 'block') return;

            if (isEditorMode) {
                if (game.get(square)) {
                    document.getElementById('feedback').innerText = "이미 기물이 있는 자리입니다. 빈 칸을 선택하세요.";
                    document.getElementById('feedback').style.color = "#e74c3c";
                    return;
                }

                const pos = { r: 8 - parseInt(square.charAt(1)), c: files.indexOf(square.charAt(0)) };

                if (editorStep === 0) {
                    game.put({ type: 'k', color: 'w' }, square);
                    editorPos.wk = pos;
                } else if (editorStep === 1) {
                    game.put({ type: 'r', color: 'w' }, square);
                    editorPos.wr = pos;
                } else if (editorStep === 2) {
                    if (pos.r === 0 || pos.r === 7) {
                        document.getElementById('feedback').innerText = "폰은 양쪽 끝 줄에 배치할 수 없습니다.";
                        document.getElementById('feedback').style.color = "#e74c3c";
                        return;
                    }
                    game.put({ type: 'p', color: 'w' }, square);
                    editorPos.wp = pos;
                } else if (editorStep === 3) {
                    if (Math.abs(pos.r - editorPos.wk.r) <= 1 && Math.abs(pos.c - editorPos.wk.c) <= 1) {
                        document.getElementById('feedback').innerText = "킹끼리는 인접할 수 없습니다.";
                        document.getElementById('feedback').style.color = "#e74c3c";
                        return;
                    }
                    game.put({ type: 'k', color: 'b' }, square);
                    editorPos.bk = pos;
                } else if (editorStep === 4) {
                    game.put({ type: 'r', color: 'b' }, square);
                    editorPos.br = pos;
                }

                moveSound.currentTime = 0;
                moveSound.play().catch(e => {});

                editorStep++;
                renderBoard();

                if (editorStep === 5) {
                    const fen = assembleFen(editorPos.wk, editorPos.wr, editorPos.wp, editorPos.bk, editorPos.br);
                    const tempGame = new Chess();
                    if (!tempGame.load(fen) || tempGame.in_check()) {
                        document.getElementById('feedback').innerText = "유효하지 않은 보드입니다. 백이 미리 체크를 당하고 있습니다. 처음부터 다시 배치합니다.";
                        document.getElementById('feedback').style.color = "#e74c3c";
                        setTimeout(() => startEditor(), 2000);
                        return;
                    }

                    isEditorMode = false;
                    game.load(fen);
                    initialFenOfCurrentGame = game.fen();
                    document.getElementById('feedback').innerText = "편집 완료! 첫 수를 둬보세요.";
                    document.getElementById('feedback').style.color = "blue";
                    updateStatus();
                } else {
                    updateStatus(); 
                }
                return; 
            }

            const mode = document.querySelector('input[name="mode"]:checked').value;
            if (game.turn() === 'b' && mode !== 'user') return;

            const piece = game.get(square);

            if (selectedSquare === null) {
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    missedBestMove = null;
                    renderBoard();
                }
                return;
            }

            const moves = game.moves({ verbose: true });
            const move = moves.find(m => m.from === selectedSquare && m.to === square);

            // 승급 처리 (자동 퀸 승급)
            let finalSan = move ? move.san : null;
            if (move && move.flags.includes('p') && !move.san.includes('=')) {
                // 이 상황을 위해 프로모션 수를 재탐색
                const promotionMove = moves.find(m => m.from === selectedSquare && m.to === square && m.promotion === 'q');
                if (promotionMove) finalSan = promotionMove.san;
            }

            if (finalSan) {
                isCalculating = true;
                selectedSquare = null;
                
                const previousFen = game.fen();
                
                const moveObj = game.move(finalSan);
                playSound(moveObj);
                renderBoard();
                
                document.getElementById('status').innerText = "당신의 수를 평가 중... (1.5초)";

                const bestMoveEngine = await getBestMove(previousFen, 1500); 
                const playerMoveEngineFormat = moveObj.from + moveObj.to + (moveObj.promotion ? moveObj.promotion : "");
                
                if (playerMoveEngineFormat === bestMoveEngine) {
                    document.getElementById('feedback').innerText = `정확한 수입니다! (${moveObj.san})`;
                    document.getElementById('feedback').style.color = "green";
                    missedBestMove = null;
                } else {
                    const tempGame = new Chess(previousFen);
                    const correctMove = tempGame.move(bestMoveEngine, { sloppy: true });
                    document.getElementById('feedback').innerText = `아쉬운 수입니다 (${moveObj.san}). 원래 뒀어야 할 수: ${correctMove.san}`;
                    document.getElementById('feedback').style.color = "#e74c3c";
                    missedBestMove = bestMoveEngine;
                }

                renderBoard();
                updateStatus();
                
                if (mode !== 'user' && game.turn() === 'b' && !game.game_over()) {
                    setTimeout(makeComputerMove, 100);
                } else {
                    isCalculating = false; 
                }

            } else {
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    missedBestMove = null;
                } else {
                    selectedSquare = null;
                }
                renderBoard();
            }
        }

        async function makeComputerMove() {
            if (game.game_over() || game.turn() !== 'b' || isDemoMode || isEditorMode) return;

            const mode = document.querySelector('input[name="mode"]:checked').value;
            if (mode === 'user') return; 

            let moveObj = null;
            isCalculating = true; 

            if (mode === 'engine') {
                document.getElementById('status').innerText = "컴퓨터(엔진)가 방어 중... (1.5초)";
                const bestMove = await getBestMove(game.fen(), 1500);
                moveObj = game.move(bestMove, { sloppy: true });
            } 
            else if (mode === 'logic') {
                document.getElementById('status').innerText = "컴퓨터(로직)가 방어 중...";
                
                const moves = game.moves({ verbose: true });
                let pPos = null;
                
                // 백 폰 위치 확인
                const boardState = game.board();
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if (boardState[r][c] && boardState[r][c].color === 'w' && boardState[r][c].type === 'p') {
                            pPos = {r, c};
                        }
                    }
                }
                
                moves.forEach(m => {
                    m.score = 0;
                    // 1순위: 폰 포획, 2순위: 룩 포획
                    if (m.captured === 'p') m.score += 1000;
                    else if (m.captured === 'r') m.score += 900;
                    
                    // 체크를 거는 수 선호
                    if (m.san.includes('+')) m.score += 50;

                    // 킹이 폰에 가까워지도록 유도
                    if (m.piece === 'k' && pPos) {
                        const toFile = files.indexOf(m.to.charAt(0));
                        const toRank = 8 - parseInt(m.to.charAt(1));
                        const distToPawn = Math.max(Math.abs(toFile - pPos.c), Math.abs(toRank - pPos.r));
                        m.score -= distToPawn; // 거리가 짧을수록 점수 상승
                    }
                });

                moves.sort((a, b) => b.score - a.score);
                const bestScoreMoves = moves.filter(m => m.score === moves[0].score);
                const chosenMove = bestScoreMoves[Math.floor(Math.random() * bestScoreMoves.length)];

                await new Promise(resolve => setTimeout(resolve, 500));
                moveObj = game.move(chosenMove.san);
            } 
            else {
                const moves = game.moves();
                const randomMove = moves[Math.floor(Math.random() * moves.length)];
                moveObj = game.move(randomMove);
            }
            
            playSound(moveObj);

            isCalculating = false;
            renderBoard();
            updateStatus();
        }

        async function runAIDemo() {
            if (isCalculating || isDemoMode || isEditorMode || game.game_over()) return;
            
            isDemoMode = true;
            selectedSquare = null;
            missedBestMove = null;
            
            savedFenBeforeDemo = game.fen();
            savedMovesBeforeDemo = game.history(); 
            
            demoHistory = [];
            demoHistory.push(game.fen());
            
            document.getElementById('feedback').innerText = "AI가 폰 승급과 체크메이트 시범을 보여줍니다!";
            document.getElementById('feedback').style.color = "#8e44ad";
            
            document.getElementById('controls').style.display = 'none';
            document.getElementById('replay-controls').style.display = 'flex';
            
            const navBtns = document.querySelectorAll('.btn-nav');
            navBtns.forEach(btn => btn.disabled = true);

            renderBoard();

            while (isDemoMode && !game.game_over()) {
                const turnStr = game.turn() === 'w' ? '백' : '흑';
                document.getElementById('status').innerText = `AI 시범 진행 중... (${turnStr} 턴)`;
                
                const bestMove = await getBestMove(game.fen(), 300);
                
                if (!isDemoMode) return;

                const moveObj = game.move(bestMove, { sloppy: true });
                playSound(moveObj);
                
                demoHistory.push(game.fen());
                
                renderBoard();
                updateStatus(); 
                
                await new Promise(resolve => setTimeout(resolve, 400));
                
                if (!isDemoMode) return;
            }

            if (isDemoMode && (game.in_checkmate() || game.in_draw())) {
                document.getElementById('feedback').innerText = "시범이 종료되었습니다. 아래 버튼으로 기보를 복기해보세요.";
                document.getElementById('feedback').style.color = "#e67e22";
                
                navBtns.forEach(btn => btn.disabled = false);
                currentDemoIndex = demoHistory.length - 1;
            }
        }

        function navDemo(action) {
            let previousIndex = currentDemoIndex;

            if (action === 'first') currentDemoIndex = 0;
            else if (action === 'prev' && currentDemoIndex > 0) currentDemoIndex--;
            else if (action === 'next' && currentDemoIndex < demoHistory.length - 1) currentDemoIndex++;
            else if (action === 'last') currentDemoIndex = demoHistory.length - 1;

            if (previousIndex !== currentDemoIndex) {
                moveSound.currentTime = 0;
                moveSound.play().catch(e => {});
            }

            game.load(demoHistory[currentDemoIndex]);
            renderBoard();
            updateStatus();
            
            document.getElementById('feedback').innerText = `기보 탐색 중: ${currentDemoIndex} / ${demoHistory.length - 1} 수`;
        }

        function exitDemo() {
            stopDemoAndReset();
            game.load(initialFenOfCurrentGame);
            
            savedMovesBeforeDemo.forEach(move => {
                game.move(move);
            });
            
            document.getElementById('feedback').innerText = "시범 종료! 여기서부터 다시 고민해보세요.";
            document.getElementById('feedback').style.color = "blue";
            
            renderBoard();
            updateStatus();
        }
    </script>
</body>
